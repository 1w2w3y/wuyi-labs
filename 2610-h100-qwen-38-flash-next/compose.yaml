# Core stack on the Azure VM with two H100 GPUs: pinned model download -> vLLM
# (tensor parallel across both GPUs) -> LiteLLM.
# Overlays: compose.observability.yaml (telemetry), compose.ngrok.yaml (public URL).
# Every port binds to 127.0.0.1; the VM itself has no public IP.
name: llm

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    # Copied into each json-file log line's "attrs", where the collector's
    # filelog receiver reads the service name (compose.observability.yaml).
    labels-regex: '^(observability\.|com\.docker\.compose\.service$)'

services:
  # One-shot job: fetch the pinned checkpoint into /data/models with the vLLM
  # image's huggingface_hub, so no extra image is needed. Re-runs only verify
  # the local copy.
  model-download:
    image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
    container_name: llm-model-download
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_XET_HIGH_PERFORMANCE: "1"
      MODEL_REPO: "${MODEL_REPO:-Qwen/Qwen3.8-Flash-Next-FP8}"
      MODEL_REVISION: "${MODEL_REVISION:-236dfdf285828023ca3bcd3f37366c58a3469b13}"
      MODEL_DIR: "${MODEL_DIR:-Qwen3.8-Flash-Next-FP8}"
    entrypoint: ["python3", "-c"]
    command:
      - |
        import os
        from huggingface_hub import snapshot_download
        path = snapshot_download(os.environ["MODEL_REPO"], revision=os.environ["MODEL_REVISION"],
                                 local_dir="/models/" + os.environ["MODEL_DIR"])
        print("checkpoint ready:", path)
    volumes:
      - /data/models:/models
    logging: *logging
    restart: "no"

  # Qwen3.8-Flash-Next (125B MoE, 6B active per token, plus a 51B n-gram
  # table) from Qwen's FP8 checkpoint, in tensor parallel across the VM's two
  # H100 NVL. vLLM's own v0.32.0 image (CUDA 13.0), which serves this
  # architecture (Qwen4ExpForConditionalGeneration) and its MTP layer; the
  # post used v0.31.0, which already ran this model on Model Runner V2, so
  # 0.32 is the same speed here with 1% more KV cache (README.md).
  qwen3.8-flash-next-vllm:
    image: vllm/vllm-openai:v0.32.0@sha256:befccf0e7e4089aa23926bb6f887a85c0d46c2a99e6de5c5ffdf5cb7957c5b34
    container_name: qwen3.8-flash-next-vllm
    depends_on:
      model-download:
        condition: service_completed_successfully
    gpus: all
    # Tensor parallelism: the two workers share memory over /dev/shm (NCCL).
    ipc: host
    ulimits:
      # vLLM keeps each GPU's share of the n-gram table in pinned host memory.
      memlock: -1
      stack: 67108864
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - /data/models:/models:ro
      - /data/vllm-cache:/root/.cache/vllm
    # The image's entry point is `vllm serve`; these are its arguments. The
    # model-specific flags follow vLLM's recipe for this model on H100
    # (recipes.vllm.ai/Qwen/Qwen3.8-Flash-Next): Triton MoE kernels, no
    # FlashInfer autotuning, MTP speculative decoding. The KV cache is FP8, as
    # in the recipe's 8x H200 command (Hopper too; its H100 command keeps
    # BF16): 1,506,691 tokens instead of 840,277 in the same memory. Coding
    # agents' sessions of 100-230K tokens stay cached between turns that much
    # longer.
    command:
      - /models/${MODEL_DIR:-Qwen3.8-Flash-Next-FP8}
      - --served-model-name
      - qwen3.8-flash-next-vllm
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --tensor-parallel-size
      - "2"
      - --max-model-len
      - "${QWEN38_FLASH_NEXT_CONTEXT_SIZE:-262144}"
      - --gpu-memory-utilization
      - "${QWEN38_FLASH_NEXT_GPU_MEMORY_UTILIZATION:-0.90}"
      - --max-num-seqs
      - "${QWEN38_FLASH_NEXT_MAX_NUM_SEQS:-32}"
      - --max-num-batched-tokens
      - "${QWEN38_FLASH_NEXT_MAX_NUM_BATCHED_TOKENS:-16384}"
      - --enable-prefix-caching
      - --kv-cache-dtype
      - fp8
      - --attention-config.indexer_kv_dtype
      - fp8
      - --moe-backend
      - triton
      - --no-enable-flashinfer-autotune
      - --spec-method
      - mtp
      - --spec-tokens
      - "${QWEN38_FLASH_NEXT_SPEC_TOKENS:-3}"
      # The scheduler prepares step N+1 while the GPUs run step N instead of
      # waiting for its sampled tokens. vLLM 0.32 turns this on by default
      # for MTP drafting; the flag pins it (README.md).
      - --async-scheduling
      - --limit-mm-per-prompt
      - '{"image":{"count":4,"width":1024,"height":1024},"video":0}'
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
    labels:
      observability.logs: "true"
      observability.service: "local-llm"
      observability.model: "${LLM_MODEL:-qwen3.8-flash-next-vllm}"
    ports:
      - "127.0.0.1:8096:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=10)"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Loading ~131 GiB of weights, pinning the n-gram table and compiling
      # for two GPUs takes longer than a one-GPU model's start.
      start_period: 40m
    logging: *logging
    restart: unless-stopped
    stop_grace_period: 2m
    init: true

  litellm:
    image: ghcr.io/berriai/litellm:v1.103.2@sha256:f63fb81b831b170ec16851e23c36ac5bf52ef106b271406429524a2ed730bbfd
    container_name: llm-litellm
    depends_on:
      qwen3.8-flash-next-vllm:
        condition: service_healthy
    command:
      - --config=/app/config.yaml
      - --log_config=/app/uvicorn_logging.json
    environment:
      LITELLM_UPSTREAM_MODEL: openai/qwen3.8-flash-next-vllm
      LITELLM_UPSTREAM_API_BASE: http://qwen3.8-flash-next-vllm:8080/v1
      LITELLM_ACTIVE_MODEL: qwen3.8-flash-next-vllm
      OTEL_EXPORTER: "${LITELLM_OTEL_EXPORTER:-otlp_http}"
      OTEL_ENDPOINT: "${LITELLM_OTEL_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_SERVICE_NAME: azure-litellm
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "${LITELLM_OTEL_CAPTURE_MESSAGE_CONTENT:-NO_CONTENT}"
      LITELLM_OTEL_V2: "true"
      OTEL_DEBUG: "${LITELLM_OTEL_DEBUG:-false}"
    labels:
      observability.logs: "true"
      observability.service: "litellm-gateway"
      observability.model: "${LLM_MODEL:-qwen3.8-flash-next-vllm}"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/request_log_callback.py:/app/request_log_callback.py:ro
      - ./litellm/uvicorn_logging.json:/app/uvicorn_logging.json:ro
    ports:
      - "127.0.0.1:4000:4000"
      # docker0's address, so containers on the VM (an agent benchmark's task
      # containers, for example) can reach the gateway. Only the host and its
      # containers see it.
      - "172.17.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *logging
    restart: unless-stopped
    init: true
